# Drop into the existing HTTPS server for dev.gameday.tech, e.g.
#   /etc/nginx/sites-available/dev.gameday.tech
# or include from that server block:
#   include /path/to/sandbox_yuan/deploy/nginx-page.conf;
#
# Public URL (no :5052):
#   https://dev.gameday.tech/page/
#
# Trailing slash on proxy_pass strips the /page prefix so the app
# still sees /, /api/..., etc.

location /page/ {
    proxy_pass http://127.0.0.1:5052/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 20m;
}

# Optional: /page -> /page/
location = /page {
    return 301 /page/;
}
