# Drop into the existing HTTPS server for dev.gameday.tech, e.g.
#   /etc/nginx/sites-available/default
# or include from that server block:
#   include /home/ubuntu/sandbox_browser_server/deploy/nginx-sandbox-browser-server.conf;
#
# Public URL (no :8090):
#   https://dev.gameday.tech/sandbox/docs
#   https://dev.gameday.tech/sandbox/api/v1/sandboxes
#
# Trailing slash on proxy_pass strips the /sandbox prefix so the app
# still sees /api/v1/... and /docs.

location /sandbox/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 20m;
}

# Optional: /sandbox -> /sandbox/
location = /sandbox {
    return 301 /sandbox/;
}
