# Drop into the existing HTTPS server for dev.gameday.tech, e.g.
#   /etc/nginx/sites-available/default
# or include from that server block:
#   include /path/to/sandbox_yuan/deploy/nginx-research.conf;
#
# Public URL (no :8010):
#   https://dev.gameday.tech/research/
#   https://dev.gameday.tech/research/docs
#
# Trailing slash on proxy_pass strips the /research prefix so the app
# still sees /api/..., /docs, etc.

location /research/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 20m;
}

# Optional: /research -> /research/
location = /research {
    return 301 /research/;
}
